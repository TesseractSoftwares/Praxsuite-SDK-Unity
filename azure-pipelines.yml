# Praxsuite SDK for Unity - validate, package, and mirror to GitHub
#
# PR and development: validate only.
# master:             validate, package a .tgz, mirror the source to the public GitHub repo,
#                     and cut a GitHub Release carrying the tarball.
#
# Validation compiles all four SDK assemblies and runs the test suite without a Unity licence,
# using the stub harness in ci~/. See ci~/Praxsuite.CI.csproj for what it does and does not cover.

trigger:
  branches:
    include:
      - master
      - development
  paths:
    exclude:
      - README.md
      - CHANGELOG.md
      - docs/*

pr:
  branches:
    include:
      - master
      - development

pool:
  name: Tesseract-BuildPool
  demands:
    - Agent.OS -equals Windows_NT

variables:
  buildConfiguration: 'Release'
  isMaster: $[eq(variables['Build.SourceBranch'], 'refs/heads/master')]
  githubRepo: 'TesseractSoftwares/Praxsuite-SDK-Unity'

stages:

# ─────────────────────────────────────────────────────────────────────────────
- stage: Validate
  displayName: 'Build and test'
  jobs:
    - job: Validate
      steps:
        - task: UseDotNet@2
          displayName: 'Install .NET SDK'
          inputs:
            packageType: 'sdk'
            version: '9.0.x'

        - script: dotnet restore ci~/Praxsuite.CI.csproj
          displayName: 'Restore'

        - script: dotnet build ci~/Praxsuite.CI.csproj -c $(buildConfiguration) --no-restore
          displayName: 'Compile Runtime, Server, Editor and Tests'

        - script: >
            dotnet test ci~/Praxsuite.CI.csproj
            -c $(buildConfiguration)
            --no-build
            --logger trx
            --results-directory $(Agent.TempDirectory)/testresults
          displayName: 'Run tests'

        - task: PublishTestResults@2
          displayName: 'Publish test results'
          condition: succeededOrFailed()
          inputs:
            testResultsFormat: 'VSTest'
            testResultsFiles: '**/*.trx'
            searchFolder: '$(Agent.TempDirectory)/testresults'
            failTaskOnFailedTests: true

        # The SDK's own build guard fails any Unity build containing a secret key. Hold this
        # repo to the same standard - a key committed here would ship to every consumer, and
        # on master the source is mirrored straight to a PUBLIC GitHub repo.
        - powershell: |
            $pattern = 'sk_live_[A-Za-z0-9]{16,}'
            $hits = Get-ChildItem -Path . -Recurse -File `
                -Include *.cs,*.json,*.md,*.txt,*.yml,*.yaml,*.asset `
              | Where-Object { $_.FullName -notmatch '\\(bin|obj|\.git)\\' } `
              | Select-String -Pattern $pattern

            if ($hits) {
              Write-Host "##vso[task.logissue type=error]A Praxsuite secret key was found in this repository."
              $hits | ForEach-Object { Write-Host "  $($_.Path):$($_.LineNumber)" }
              Write-Host "Revoke that key now - it is in git history, and this repo is mirrored publicly."
              exit 1
            }

            Write-Host "No secret keys found."
          displayName: 'Scan for leaked secret keys'

# ─────────────────────────────────────────────────────────────────────────────
- stage: Publish
  displayName: 'Package and mirror to GitHub'
  dependsOn: Validate
  condition: and(succeeded(), eq(variables.isMaster, true))
  jobs:
    - job: Publish
      steps:
        # Full history: the mirror push needs real commits, not a shallow clone.
        - checkout: self
          fetchDepth: 0
          persistCredentials: true

        - task: AzureKeyVault@2
          displayName: 'Read GitHub token'
          inputs:
            azureSubscription: 'sc-acr-push-core-prod'
            KeyVaultName: 'prax-cicd-kv'
            SecretsFilter: 'GITHUB-SDK-MIRROR-TOKEN'
            RunAsPreJob: false

        # package.json is the single source of truth for the release tag, so a release can
        # never silently disagree with the version consumers actually install.
        - powershell: |
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $version = $pkg.version
            if (-not $version) {
              Write-Host "##vso[task.logissue type=error]package.json has no version field."
              exit 1
            }
            Write-Host "Package version: $version"
            Write-Host "##vso[task.setvariable variable=pkgVersion]$version"
          displayName: 'Read package version'

        # UPM consumes a plain npm tarball, so npm pack IS the packaging step - a source-only
        # package needs no Unity build.
        - powershell: |
            npm pack
            $tgz = Get-ChildItem -Filter '*.tgz' | Select-Object -First 1
            if (-not $tgz) {
              Write-Host "##vso[task.logissue type=error]npm pack produced no tarball."
              exit 1
            }
            New-Item -ItemType Directory -Force '$(Build.ArtifactStagingDirectory)/package' | Out-Null
            Move-Item $tgz.FullName '$(Build.ArtifactStagingDirectory)/package/'
            Write-Host "Packed $($tgz.Name)"
          displayName: 'Pack UPM tarball'

        - task: PublishBuildArtifacts@1
          displayName: 'Publish tarball artifact'
          inputs:
            PathtoPublish: '$(Build.ArtifactStagingDirectory)/package'
            ArtifactName: 'upm-package'

        # Mirror to the public repo. --force-with-lease rather than --force: if someone pushed
        # to GitHub directly, this fails loudly instead of destroying their commit.
        - powershell: |
            $token = '$(GITHUB-SDK-MIRROR-TOKEN)'
            $repo  = '$(githubRepo)'

            git config user.email "ci@tesseractsoftwares.com"
            git config user.name  "Tesseract CI"

            git remote remove github 2>$null
            git remote add github "https://x-access-token:$token@github.com/$repo.git"

            # Needed for --force-with-lease to have a baseline to compare against.
            git fetch github master 2>$null

            Write-Host "Mirroring master to github.com/$repo"
            git push github HEAD:refs/heads/master --force-with-lease
            if ($LASTEXITCODE -ne 0) {
              Write-Host "##vso[task.logissue type=error]Mirror push rejected: GitHub has commits this repo does not. Reconcile them rather than forcing."
              exit 1
            }

            Write-Host "Mirror complete."
          displayName: 'Mirror source to GitHub'

        # Tag and release, but only when this version has not been released before, so
        # re-running a build is harmless rather than a failure.
        - powershell: |
            $token   = '$(GITHUB-SDK-MIRROR-TOKEN)'
            $repo    = '$(githubRepo)'
            $version = '$(pkgVersion)'
            $tag     = "v$version"

            $headers = @{
              Authorization = "Bearer $token"
              Accept        = 'application/vnd.github+json'
              'User-Agent'  = 'tesseract-ci'
            }

            $existing = $null
            try {
              $existing = Invoke-RestMethod -Headers $headers `
                -Uri "https://api.github.com/repos/$repo/releases/tags/$tag"
            } catch { }

            if ($existing) {
              Write-Host "Release $tag already exists - nothing to publish."
              exit 0
            }

            $notes = "Install in Unity via Package Manager -> Add package from git URL:`n`n" +
                     "    https://github.com/$repo.git`n`n" +
                     "See CHANGELOG.md for what changed."

            $body = @{
              tag_name   = $tag
              name       = "Praxsuite SDK for Unity $version"
              body       = $notes
              draft      = $false
              prerelease = $false
            } | ConvertTo-Json

            $release = Invoke-RestMethod -Method Post -Headers $headers `
              -Uri "https://api.github.com/repos/$repo/releases" -Body $body -ContentType 'application/json'

            $tgz = Get-ChildItem '$(Build.ArtifactStagingDirectory)/package' -Filter '*.tgz' | Select-Object -First 1
            $uploadUrl = "https://uploads.github.com/repos/$repo/releases/$($release.id)/assets?name=$($tgz.Name)"

            Invoke-RestMethod -Method Post -Headers $headers -Uri $uploadUrl `
              -InFile $tgz.FullName -ContentType 'application/gzip' | Out-Null

            Write-Host "Published release $tag with $($tgz.Name)"
          displayName: 'Cut GitHub release'
